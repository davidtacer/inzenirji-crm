name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm
          POSTGRES_DB: crm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crm"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      TEST_DATABASE_URL: postgres://crm:crm@127.0.0.1:5432/crm_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Integration tests (real Postgres, migrations from zero)
        run: pnpm test:int
      - name: Build
        run: pnpm build
      - name: Docker build + container health (migrations at start, DB check)
        run: |
          docker build --build-arg GIT_SHA=${{ github.sha }} -t inzenirji-crm:ci .
          psql "postgres://crm:crm@127.0.0.1:5432/postgres" -c "create database crm_docker"
          docker run -d --name crm-ci --network host \
            -e RUN_MIGRATIONS=1 -e DATABASE_URL=postgres://crm:crm@127.0.0.1:5432/crm_docker \
            -e BETTER_AUTH_SECRET=ci-secret-ci-secret-ci-secret-1234 -e APP_URL=http://127.0.0.1:3000 \
            -e OWNER_EMAILS=owner@example.com -e SMTP_HOST=127.0.0.1 -e SMTP_PORT=2525 -e SMTP_USER=ci \
            -e SMTP_PASSWORD=ci -e EMAIL_FROM=ci@example.com inzenirji-crm:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3000/api/health && break; sleep 1; done
          body=$(curl -fsS http://127.0.0.1:3000/api/health)
          echo "$body"
          echo "$body" | grep -q '"sha":"${{ github.sha }}"' && echo "$body" | grep -q '"db":"ok"'
          test "$(psql "postgres://crm:crm@127.0.0.1:5432/crm_docker" -tAc "select count(*) from drizzle.__drizzle_migrations")" -ge 1
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/login)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/)" = "307"
          docker logs crm-ci | tail -20
