# Kamal 2 — CRM on the shared Hetzner VM (ADR-011). Same pattern as Postaja prod (Postaja ADR-027/084):
# host nginx terminates TLS for crm.inzenirji.si and proxies to the shared kamal-proxy on 127.0.0.1:8080;
# kamal-proxy routes crm.inzenirji.si to this service. Only our own service, accessory and volume are created.
# Secrets come only from .kamal/secrets, which reads the environment (GitHub environment "prod").
service: inzenirji-crm
image: davidtacer/inzenirji-crm

servers:
  web:
    hosts:
      - <%= ENV.fetch("PROD_HOST") %>
    options:
      memory: 768m

registry:
  server: ghcr.io
  username:
    - KAMAL_REGISTRY_USERNAME
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64
  args:
    GIT_SHA: <%= ENV.fetch("GITHUB_SHA") { `git rev-parse HEAD`.strip } %>

ssh:
  user: deploy

proxy:
  host: crm.inzenirji.si
  ssl: false            # TLS is done by host nginx (ops/nginx/crm.inzenirji.si.conf)
  forward_headers: true # trust X-Forwarded-* from nginx
  app_port: 3000
  healthcheck:
    path: /api/health
    interval: 3
    timeout: 5

env:
  clear:
    NODE_ENV: production
    RUN_MIGRATIONS: "1"
    APP_URL: https://crm.inzenirji.si
    BETTER_AUTH_URL: https://crm.inzenirji.si
    # Login e-mails (ADR-015): system mailbox, same as Postaja and the editor.
    SMTP_HOST: mail.datavallis.com
    SMTP_PORT: "465"
    SMTP_USER: hello@inzenirji.si
    EMAIL_FROM: "Inženirji.si CRM <hello@inzenirji.si>"
    # Google Places Text Search: paid calls per day, reset at midnight Europe/Ljubljana (TASK-005).
    PLACES_DAILY_CALL_CAP: "100"
    OWNER_EMAILS: "<%= ENV.fetch("OWNER_EMAILS") %>"
    # Outreach (TASK-008, ADR-013/019): first-person mailbox. Sending stays off until the owner sets the
    # GitHub variable OUTREACH_ENABLED=1 (only after DKIM passes) and the secret OUTREACH_SMTP_PASSWORD.
    OUTREACH_ENABLED: "<%= ENV.fetch("OUTREACH_ENABLED", "0") %>"
    OUTREACH_DAILY_CAP: "10"
    OUTREACH_SMTP_USER: david@inzenirji.si
    OUTREACH_FROM: "David Tacer <david@inzenirji.si>"
    # AI personal remark (TASK-024, ADR-021): model and a hard daily spend limit (rolling 24 h).
    AI_MODEL: claude-sonnet-5-5
    AI_DAILY_BUDGET_USD: "2"
    # Google Calendar appointment schedule link for reply drafts (ADR-008); empty until the owner creates it.
    BOOKING_URL: "<%= ENV.fetch("BOOKING_URL", "") %>"
    # Owner's phone offered in reply drafts (TASK-027); empty = ask the prospect for theirs.
    OWNER_PHONE: "<%= ENV.fetch("OWNER_PHONE", "") %>"
  secret:
    - DATABASE_URL
    - BETTER_AUTH_SECRET
    - SMTP_PASSWORD
    - GOOGLE_PLACES_API_KEY
    - OUTREACH_SMTP_PASSWORD
    - ANTHROPIC_API_KEY

accessories:
  db:
    # Container name: inzenirji-crm-db. No `port:` → reachable only on the internal `kamal` Docker network.
    image: postgres:16
    host: <%= ENV.fetch("PROD_HOST") %>
    env:
      clear:
        POSTGRES_USER: crm
        POSTGRES_DB: crm_prod
      secret:
        - POSTGRES_PASSWORD
    volumes:
      - inzenirji-crm-db-data:/var/lib/postgresql/data
    options:
      memory: 512m

# Keep a few old images for rollback, prune the rest (shared host).
retain_containers: 3
