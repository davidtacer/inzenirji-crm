# Host nginx on the shared Hetzner VM (ADR-011, same pattern as Postaja). Owner installs once:
#   sudo cp crm.inzenirji.si.conf /etc/nginx/sites-available/ && sudo ln -s /etc/nginx/sites-available/crm.inzenirji.si.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx      # stop if nginx -t fails; do not touch other server blocks
#   sudo certbot --nginx -d crm.inzenirji.si          # adds the 443 server block and redirect
server {
    listen 80;
    listen [::]:80;
    server_name crm.inzenirji.si;

    client_max_body_size 50M;   # client material uploads

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
